<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <rect width="1200" height="300" fill="#ffffff"/>
  <style>
    .box{fill:#f6f8fa;stroke:#1f6feb;stroke-width:3;rx:18;ry:18}
    .t{font:700 26px Arial,sans-serif;fill:#24292f;text-anchor:middle}
    .s{font:18px Arial,sans-serif;fill:#57606a;text-anchor:middle}
    .a{stroke:#57606a;stroke-width:4;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#57606a"/></marker></defs>
  <rect class="box" x="40" y="80" width="230" height="130"/>
  <text class="t" x="155" y="125">60 nm Baseline</text><text class="s" x="155" y="160">SCE / leakage</text>
  <line class="a" x1="285" y1="145" x2="370" y2="145"/>
  <rect class="box" x="385" y="80" width="230" height="130"/>
  <text class="t" x="500" y="125">HKMG</text><text class="s" x="500" y="160">HfO₂ + TiN</text><text class="s" x="500" y="187">Punch-through remains</text>
  <line class="a" x1="630" y1="145" x2="715" y2="145"/>
  <rect class="box" x="730" y="80" width="230" height="130"/>
  <text class="t" x="845" y="125">Halo Split</text><text class="s" x="845" y="160">Dose / Energy / Tilt</text>
  <line class="a" x1="975" y1="145" x2="1040" y2="145"/>
  <rect class="box" x="1050" y="55" width="125" height="180"/>
  <text class="t" x="1112" y="105">Final</text><text class="s" x="1112" y="140">2e13</text><text class="s" x="1112" y="168">20 keV</text><text class="s" x="1112" y="196">25°</text>
</svg>
